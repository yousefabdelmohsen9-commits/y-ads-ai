<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y-Ads AI | منصة الإعلانات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">Y</div>
                <span class="font-extrabold text-xl tracking-wider bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Y-Ads AI</span>
            </div>

            <div id="auth-section">
                <button id="login-btn" onclick="login()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl transition border border-slate-700 font-semibold shadow-sm">
                    <i class="fab font-bold text-lg fa-google text-red-400"></i>
                    <span>تسجيل الدخول مع Google</span>
                </button>
                <div id="user-profile" class="hidden flex items-center gap-4">
                    <div class="bg-indigo-950/80 border border-indigo-500/30 px-4 py-1.5 rounded-xl flex items-center gap-2">
                        <i class="fas fa-coins text-amber-400"></i>
                        <span class="text-xs text-slate-400">النقاط:</span>
                        <span id="user-credits" class="font-bold text-indigo-400">0</span>
                    </div>
                    <img id="user-avatar" class="w-9 h-9 rounded-full border-2 border-indigo-500" src="" alt="Avatar">
                    <button onclick="logout()" class="text-slate-400 hover:text-red-400 transition text-sm font-semibold">خروج</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-28 pb-12 flex flex-col justify-center">
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-black mb-4 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">صانع الإعلانات الذكي</h1>
            <p class="text-slate-400 text-base sm:text-lg">اكتب فكرة منتجك واحصل على نص إعلاني احترافي فوراً (-1 نقطة)</p>
        </div>

        <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 sm:p-8 backdrop-blur shadow-2xl space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">اسم المنتج أو الخدمة</label>
                <input type="text" id="product-name" placeholder="مثال: متجر عطور فاخرة" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">وصف قصير أو الفئة المستهدفة</label>
                <textarea id="product-desc" rows="3" placeholder="مثال: خصم 50% بمناسبة الافتتاح والتوصيل مجاني..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition"></textarea>
            </div>
